default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV["DATABASE_PORT"] %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: expense_tracker_development

  
test:
  <<: *default
  database: expense_tracker_test

production:
  primary: &primary_production
    <<: *default
    database: expense_tracker_production
    username: expense_tracker_api
    password: <%= ENV["EXPENSE_TRACKER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: expense_tracker_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: expense_tracker_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: expense_tracker_production_cable
    migrations_paths: db/cable_migrate